<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --fundo: #ffffff; --cartao: #f5f5f7; --linha: #e5e5ea; --texto: #1d1d1f; --suave: #6e6e73;
    --botao: #1d1d1f; --botao-texto: #ffffff; --ok: #1f8a3b; --erro: #c9342c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #000000; --cartao: #1c1c1e; --linha: #2c2c2e; --texto: #f5f5f7; --suave: #98989d;
      --botao: #f5f5f7; --botao-texto: #000000; --ok: #30d158; --erro: #ff453a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 120px; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  .sub { color: var(--suave); margin: 0 0 28px; }
  .sub a { color: inherit; }
  .area {
    display: block; border: 1.5px dashed var(--linha); border-radius: 18px; background: var(--cartao);
    padding: 40px 20px; text-align: center; cursor: pointer; transition: border-color .15s;
  }
  .area:hover, .area.sobre { border-color: var(--suave); }
  .area strong { display: block; font-size: 19px; margin-bottom: 4px; }
  .area span { color: var(--suave); font-size: 14px; }
  input[type=file] { display: none; }
  .resumo { display: flex; gap: 8px 24px; flex-wrap: wrap; margin: 28px 0 12px; color: var(--suave); font-size: 15px; }
  .resumo { gap: 8px; margin: 24px 0 14px; }
  .resumo button {
    background: var(--cartao); color: var(--suave); font-weight: 400; font-size: 15px; padding: 7px 14px;
    border: 1px solid var(--linha);
  }
  .resumo button b { color: var(--texto); font-weight: 600; margin-right: 5px; }
  .resumo button.ativo { background: var(--botao); color: var(--botao-texto); border-color: var(--botao); }
  .resumo button.ativo b { color: var(--botao-texto); }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linha); }
  li { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--linha); }
  li img, li .sem { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; background: var(--cartao); flex: none; }
  .meio { flex: 1; min-width: 0; }
  .arq { font-size: 13px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sugestoes { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  .sugestoes button { font-size: 13px; font-weight: 500; padding: 5px 11px; background: var(--cartao); color: var(--texto); border: 1px solid var(--linha); }
  select, input.busca {
    width: 100%; font: inherit; color: var(--texto); background: var(--cartao); border: 1px solid var(--linha);
    border-radius: 10px; padding: 7px 10px; margin: 3px 0; -webkit-appearance: none; appearance: none;
  }
  .motivo { font-size: 13px; color: var(--suave); }
  .motivo.ok { color: var(--ok); }
  .motivo.erro { color: var(--erro); }
  .barra {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--fundo) 85%, transparent); backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--linha);
  }
  .barra div { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; }
  .barra p { flex: 1 1 100%; margin: 0; color: var(--suave); font-size: 14px; }
  .barra button:last-child { flex: 1; }
  @media (min-width: 600px) { .barra p { flex-basis: 0; } .barra button:last-child { flex: none; } }
  .com-fotos .area { padding: 18px 20px; }
  .com-fotos .area span { display: none; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 980px; padding: 12px 22px; cursor: pointer;
    background: var(--botao); color: var(--botao-texto);
  }
  button.leve, .botao-leve { background: var(--cartao); color: var(--texto); }
  .botao-leve { font-weight: 600; border-radius: 980px; cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  [hidden] { display: none !important; }
  .opcoes { display: flex; gap: 10px; margin-top: 10px; }
  .opcoes > * { flex: 1; text-align: center; padding: 11px 12px; font-size: 15px; }
  .com-fotos .opcoes { display: none; }
  .andamento { margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: var(--cartao); font-size: 15px; }
  .andamento small { display: block; color: var(--suave); margin-top: 2px; }
  .andamento .trilho { height: 4px; border-radius: 2px; background: var(--linha); margin-top: 10px; overflow: hidden; }
  .andamento .trilho i { display: block; height: 100%; background: var(--texto); transition: width .4s; }
  .guardadas-botao { margin-top: 14px; padding: 9px 16px; font-size: 15px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; margin: 16px 0 8px; }
  .grade .cartao { font-size: 12px; text-align: center; }
  .grade a { color: var(--texto); text-decoration: none; }
  .grade .acoes { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }
  .grade .acoes button { font-size: 12px; font-weight: 500; padding: 4px 9px; background: var(--cartao); color: var(--texto); border: 1px solid var(--linha); }
  .grade input.busca { font-size: 13px; padding: 5px 8px; margin-top: 4px; }
  .grade img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; background: var(--cartao); display: block; margin-bottom: 4px; }
  .drive { display: flex; gap: 10px; margin-top: 10px; }
  .drive input {
    flex: 1; min-width: 0; font: inherit; color: var(--texto); background: var(--cartao);
    border: 1px solid var(--linha); border-radius: 980px; padding: 10px 16px;
  }
</style>
</head>
<body>
<main>
  <h1>Fotos da equipe</h1>
  <p class="sub" id="sub">Escolha a pasta ou as fotos. O app acha a pessoa pelo nome ou número do arquivo e coloca o link na coluna FOTOS.</p>

  <label class="area" id="area">
    <strong id="rotulo">Escolher fotos</strong>
    <span>Várias de uma vez ou um arquivo .zip. Também dá para arrastar aqui.</span>
    <input type="file" id="entrada" multiple accept="image/*,.zip,application/zip">
  </label>
  <div class="opcoes">
    <label class="botao-leve">Pasta do PC<input type="file" id="entradaPasta" webkitdirectory multiple></label>
    <button class="leve" type="button" id="botaoDrive">Pasta do Drive</button>
  </div>
  <div class="drive" id="drive" hidden>
    <input id="linkDrive" placeholder="Cole o link da pasta do Drive" autocomplete="off">
    <button id="abrirDrive" type="button">Abrir</button>
  </div>

  <div class="andamento" id="andamento" hidden></div>
  <button class="leve guardadas-botao" id="botaoGuardadas" type="button" hidden></button>
  <div class="grade" id="guardadas" hidden></div>

  <div id="painel" hidden>
    <div class="resumo" id="resumo"></div>
    <ul id="lista"></ul>
  </div>
  <datalist id="pessoasLista"></datalist>
</main>

<div class="barra" id="barra" hidden>
  <div>
    <p id="status"></p>
    <button class="leve" id="limpar">Limpar</button>
    <button id="enviar">Colocar na planilha</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  var itens = [];        // { arquivo, blob | driveId, url, r, escolha, estado }
  var pessoas = [];
  var porChave = {};
  var enviando = false;
  var filtro = '';       // '' = todas; senão certo, conferir, duvida, nada ou feito

  var $ = function (id) { return document.getElementById(id); };

  function chamar(nome, arg) {
    return new Promise(function (ok, falha) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(falha)[nome](arg);
    });
  }

  function ehImagem(nome, tipo) {
    return /^image\//.test(tipo || '') || /\.(jpe?g|png|webp|heic|heif|gif|bmp)$/i.test(nome);
  }

  async function abrirArquivos(lista) {
    if (enviando) return;
    var novos = [];
    $('status').textContent = 'Abrindo arquivos…';
    $('barra').hidden = false;
    for (var i = 0; i < lista.length; i++) {
      var f = lista[i];
      if (/\.zip$/i.test(f.name) || f.type === 'application/zip') {
        var zip = await JSZip.loadAsync(f);
        var nomes = Object.keys(zip.files);
        for (var j = 0; j < nomes.length; j++) {
          var z = zip.files[nomes[j]];
          var curto = nomes[j].split('/').pop();
          if (z.dir || curto.charAt(0) === '.' || nomes[j].indexOf('__MACOSX') >= 0 || !ehImagem(curto)) continue;
          var b = await z.async('blob');
          novos.push({ arquivo: curto, blob: b, origem: curto + '|' + b.size });
        }
      } else if (ehImagem(f.name, f.type) && f.name.charAt(0) !== '.') {
        novos.push({ arquivo: f.name, blob: f, origem: f.name + '|' + f.size });
      }
    }
    await juntar(novos);
  }

  async function juntar(novos) {
    if (!novos.length) { $('status').textContent = 'Nenhuma foto encontrada.'; return; }
    itens = itens.concat(novos);
    await preparar();
  }

  // Pasta do Drive: as fotos ficam onde estão; o app só cria o link de cada uma.
  async function abrirDrive() {
    var link = $('linkDrive').value.trim();
    if (!link || enviando) return;
    $('barra').hidden = false;
    $('status').textContent = 'Procurando fotos na pasta do Drive…';
    try {
      var resp = await chamar('apiListarPasta', link);
      $('drive').hidden = true;
      await juntar(resp.arquivos.map(function (a) {
        return { arquivo: a.nome, driveId: a.id, origem: 'drive:' + a.id, url: 'https://drive.google.com/thumbnail?id=' + a.id + '&sz=w120' };
      }));
    } catch (e) {
      $('status').textContent = 'Erro: ' + (e && e.message || e);
    }
  }

  // Arrastar uma pasta: lê tudo o que tem dentro, inclusive subpastas.
  function lerEntrada(entrada) {
    return new Promise(function (ok) {
      if (entrada.isFile) return entrada.file(function (f) { ok([f]); }, function () { ok([]); });
      var leitor = entrada.createReader(), todos = [];
      (function ler() {
        leitor.readEntries(async function (lote) {
          if (!lote.length) {
            var listas = await Promise.all(todos.map(lerEntrada));
            return ok([].concat.apply([], listas));
          }
          todos = todos.concat(lote);
          ler();
        }, function () { ok([]); });
      })();
    });
  }

  async function preparar() {
    $('status').textContent = 'Procurando as pessoas na planilha…';
    $('enviar').disabled = true;
    try {
      var resp = await chamar('apiPreparar', itens.map(function (it) { return { nome: it.arquivo, origem: it.origem }; }));
      pessoas = resp.pessoas;
      porChave = {};
      pessoas.forEach(function (p) { porChave[p.chave] = p; });
      preencherLista();
      $('sub').innerHTML = 'Planilha <a href="' + resp.planilhaUrl + '" target="_blank">' + esc(resp.planilha) +
        '</a> · abas ' + resp.abas.map(esc).join(' e ');
      itens.forEach(function (it, i) {
        it.r = resp.resultado[i];
        if (!it.estado) it.escolha = it.r.ja ? '' : it.r.chave;
      });
      desenhar();
    } catch (e) {
      $('status').textContent = 'Erro: ' + (e && e.message || e);
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }

  // Campo de busca: digite parte do nome (ou o número) e escolha na lista que aparece.
  function rotulo(p) {
    return p.nome + (p.numeros.length ? ' · nº ' + p.numeros.join('/') : '') + (p.temFoto ? ' · já tem foto' : '');
  }

  function semAcento(t) {
    return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim();
  }

  function acharPorTexto(texto) {
    var t = semAcento(texto);
    if (!t) return '';
    var exato = pessoas.filter(function (p) { return semAcento(rotulo(p)) === t || semAcento(p.nome) === t; });
    if (exato.length === 1) return exato[0].chave;
    var parte = pessoas.filter(function (p) { return semAcento(rotulo(p)).indexOf(t) >= 0; });
    return parte.length === 1 ? parte[0].chave : null;
  }

  function preencherLista() {
    $('pessoasLista').innerHTML = pessoas.map(function (p) { return '<option value="' + esc(rotulo(p)) + '">'; }).join('');
  }

  function sugestoesHtml(it, i) {
    if (it.estado || it.escolha) return '';
    var sug = it.r.opcoes.filter(function (c) { return porChave[c]; });
    if (!sug.length) return '';
    return '<div class="sugestoes">' + sug.map(function (c) {
      return '<button type="button" data-i="' + i + '" data-c="' + esc(c) + '">' + esc(porChave[c].nome) + '</button>';
    }).join('') + '</div>';
  }

  function desenhar() {
    $('painel').hidden = false;
    document.body.classList.add('com-fotos');
    $('rotulo').textContent = 'Adicionar mais fotos';
    preencherLista();
    var lista = $('lista');
    lista.innerHTML = '';
    itens.forEach(function (it, i) {
      if (filtro ? categoria(it) !== filtro : categoria(it) === 'feito') return;
      if (!it.url) it.url = URL.createObjectURL(it.blob);
      var li = document.createElement('li');
      var classe = it.estado === 'feito' || it.estado === 'fila' ? 'ok' : it.estado === 'erro' ? 'erro' : '';
      var texto = it.msg || it.r.motivo;
      li.innerHTML = '<img loading="lazy" src="' + it.url + '" alt="" onerror="this.outerHTML=\'<div class=sem></div>\'">' +
        '<div class="meio"><div class="arq">' + esc(it.arquivo) + '</div>' +
        '<input type="search" class="busca" list="pessoasLista" placeholder="Digite o nome da pessoa" data-i="' + i + '" value="' +
        esc(it.escolha && porChave[it.escolha] ? rotulo(porChave[it.escolha]) : '') + '"' +
        (it.estado === 'feito' || it.estado === 'fila' || enviando ? ' disabled' : '') + '>' + sugestoesHtml(it, i) +
        '<div class="motivo ' + classe + '">' + esc(texto) + '</div></div>';
      lista.appendChild(li);
    });
    lista.querySelectorAll('input.busca').forEach(function (campo) {
      var escolher = function (final) {
        var it = itens[+campo.dataset.i];
        var chave = acharPorTexto(campo.value);
        if (chave === null) {
          if (!final) return;
          it.escolha = '';
          it.msg = 'Não achei uma pessoa só com esse nome. Digite mais letras e escolha na lista.';
        } else {
          if (!final && chave && semAcento(campo.value) !== semAcento(rotulo(porChave[chave]))) return;
          it.escolha = chave;
          it.msg = chave ? 'Escolhido por você.' : 'Não vai ser colocada.';
          if (chave) campo.value = rotulo(porChave[chave]);
        }
        var sug = campo.parentNode.querySelector('.sugestoes');
        if (sug && it.escolha) sug.remove();
        campo.parentNode.querySelector('.motivo').textContent = it.msg;
        atualizarResumo();
      };
      campo.oninput = function () { escolher(false); };   // escolheu da lista
      campo.onchange = function () { escolher(true); };   // saiu do campo / Enter
    });
    lista.querySelectorAll('.sugestoes button').forEach(function (b) {
      b.onclick = function () {
        var campo = lista.querySelector('input.busca[data-i="' + b.dataset.i + '"]');
        campo.value = rotulo(porChave[b.dataset.c]);
        campo.onchange();
      };
    });
    atualizarResumo();
  }

  function categoria(it) {
    if (it.estado === 'feito' || it.r.ja) return 'feito';
    return it.estado === 'fila' ? 'fila' : it.r.nivel;
  }

  // Tocar numa categoria mostra só ela; tocar de novo (ou em Todas) volta a mostrar tudo.
  function filtrar(f) {
    filtro = filtro === f ? '' : f;
    desenhar();
    window.scrollTo({ top: $('resumo').offsetTop - 12, behavior: 'smooth' });
  }

  function atualizarResumo() {
    var c = { certo: 0, conferir: 0, duvida: 0, nada: 0, feito: 0, fila: 0 }, prontos = 0;
    itens.forEach(function (it) {
      c[categoria(it)]++;
      if ((!it.estado || it.estado === 'erro') && it.escolha) prontos++;
    });
    if (filtro && !c[filtro]) filtro = '';
    var bloco = function (f, n, t) {
      return n ? '<button type="button" data-f="' + f + '"' + (filtro === f ? ' class="ativo"' : '') + '><b>' + n + '</b>' + t + '</button>' : '';
    };
    $('resumo').innerHTML = bloco('', itens.length - c.feito, 'todas') + bloco('certo', c.certo, 'prontas') +
      bloco('conferir', c.conferir, 'para conferir') + bloco('duvida', c.duvida, 'você escolhe') +
      bloco('nada', c.nada, 'sem pessoa') + bloco('fila', c.fila, 'na fila') + bloco('feito', c.feito, 'já na planilha');
    $('resumo').querySelectorAll('button').forEach(function (b) {
      b.onclick = function () { filtrar(b.dataset.f); };
    });
    var feitos = c.feito;
    $('enviar').disabled = enviando || !prontos;
    $('enviar').textContent = prontos ? 'Colocar ' + prontos + (prontos === 1 ? ' foto' : ' fotos') : 'Colocar na planilha';
    if (!enviando) {
      $('status').textContent = prontos ? 'Confira as escolhas e toque em Colocar.' :
        c.fila ? 'Fotos do Drive na fila. Pode fechar o app.' :
        feitos ? 'Pronto. Os links estão na planilha.' : 'Escolha a pessoa das fotos que faltam.';
    }
  }

  // Foto grande é reduzida para no máximo 1600 px (fica leve e rápida de abrir pelo link).
  function prepararFoto(blob) {
    return new Promise(function (ok) {
      var img = new Image();
      var url = URL.createObjectURL(blob);
      img.onload = function () {
        var lado = Math.max(img.naturalWidth, img.naturalHeight);
        if (lado <= 1600 && blob.size <= 1500000 && /jpe?g|png/.test(blob.type)) return ok(blob);
        var k = Math.min(1, 1600 / lado);
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { ok(b || blob); }, 'image/jpeg', 0.88);
      };
      img.onerror = function () { ok(blob); };   // HEIC fora do Safari: vai o original
      img.src = url;
    });
  }

  function base64(blob) {
    return new Promise(function (ok, falha) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).split(',')[1]); };
      r.onerror = falha;
      r.readAsDataURL(blob);
    });
  }

  async function enviarTodas() {
    var fila = itens.filter(function (it) { return it.escolha && (!it.estado || it.estado === 'erro'); });
    if (!fila.length) return;
    enviando = true;
    desenhar();
    // Fotos do Drive: vão para a fila do Google, que continua sozinha mesmo com o app fechado.
    var doDrive = fila.filter(function (it) { return it.driveId; });
    if (doDrive.length) {
      $('status').textContent = 'Mandando ' + doDrive.length + ' fotos do Drive para a fila…';
      try {
        var est = await chamar('apiEnfileirar', doDrive.map(function (it) {
          return { driveId: it.driveId, chave: it.escolha, arquivo: it.arquivo };
        }));
        doDrive.forEach(function (it) { it.estado = 'fila'; it.msg = 'Na fila. Continua mesmo se você fechar o app.'; });
        google.script.run.processarFila();   // começa já; o Google segue sozinho depois
        mostrarAndamento(est);
      } catch (e) {
        doDrive.forEach(function (it) { it.estado = 'erro'; it.msg = 'Não deu: ' + (e && e.message || e); });
      }
    }
    // Fotos do PC: precisam do app aberto enquanto são enviadas. O que já foi não volta, mesmo recarregando.
    var doPc = fila.filter(function (it) { return !it.driveId; });
    var feitas = 0, erros = 0;
    for (var i = 0; i < doPc.length; i++) {
      var it = doPc[i];
      $('status').textContent = 'Enviando ' + (i + 1) + ' de ' + doPc.length + ' do PC… deixe o app aberto.';
      try {
        var foto = await prepararFoto(it.blob);
        var resp = await chamar('apiEnviar', {
          chave: it.escolha, arquivo: it.arquivo, origem: it.origem, mime: foto.type || 'image/jpeg', base64: await base64(foto)
        });
        it.estado = 'feito';
        it.msg = (resp.substituiu ? 'Trocou a foto em ' : 'Colocada em ') + resp.lugares.join(' e ') + '.';
        porChave[it.escolha].temFoto = true;
        feitas++;
      } catch (e) {
        it.estado = 'erro';
        it.msg = 'Não deu: ' + (e && e.message || e);
        erros++;
      }
    }
    enviando = false;
    desenhar();
    if (doPc.length) {
      $('status').textContent = feitas + (feitas === 1 ? ' foto colocada' : ' fotos colocadas') +
        (erros ? ', ' + erros + ' com erro (tente de novo).' : '.');
    }
    atualizarEstado();
  }

  /* ---------------------------------------------------------------- fila e fotos guardadas */

  var espera = null;

  function mostrarAndamento(est) {
    var f = est.fila, caixa = $('andamento');
    var naFila = {};
    f.naFila.forEach(function (id) { naFila[id] = true; });
    // Fotos que saíram da fila nesta tela viram "já na planilha".
    var mudou = false;
    itens.forEach(function (it) {
      if (it.estado !== 'fila' || naFila[it.driveId]) return;
      var erro = f.erros.filter(function (e) { return e.indexOf(it.arquivo + ':') === 0; })[0];
      it.estado = erro ? 'erro' : 'feito';
      it.msg = erro ? 'Não deu: ' + erro.slice(it.arquivo.length + 2) : 'Colocada na planilha.';
      if (!erro && porChave[it.escolha]) porChave[it.escolha].temFoto = true;
      mudou = true;
    });
    if (mudou && itens.length) desenhar();
    if (f.faltam) {
      var feitas = f.total - f.faltam;
      caixa.innerHTML = 'Colocando fotos do Drive: <b>' + feitas + ' de ' + f.total + '</b>' +
        '<small>Continua sozinho, mesmo se você fechar o app ou a planilha.</small>' +
        '<div class="trilho"><i style="width:' + Math.round(100 * feitas / Math.max(1, f.total)) + '%"></i></div>';
      caixa.hidden = false;
      clearTimeout(espera);
      espera = setTimeout(atualizarEstado, 5000);
    } else if (f.total) {
      caixa.innerHTML = 'Fila do Drive terminada: <b>' + f.feitas + ' de ' + f.total + '</b> colocadas' +
        (f.erros.length ? '<small>' + f.erros.length + ' com erro: ' + esc(f.erros.slice(-3).join(' · ')) + '</small>' : '');
      caixa.hidden = false;
    }
    desenharGuardadas(est.guardadas);
  }

  // Fotos guardadas: abrir, trocar de pessoa (nome errado) ou excluir.
  var editando = false;

  function desenharGuardadas(g) {
    $('botaoGuardadas').hidden = !g.length;
    $('botaoGuardadas').textContent = 'Fotos guardadas (' + g.length + ')';
    if (!g.length) $('guardadas').hidden = true;
    if (editando) return;
    $('guardadas').innerHTML = g.map(function (x) {
      return '<div class="cartao" data-c="' + esc(x.chave) + '"><a href="' + x.link + '" target="_blank">' +
        '<img loading="lazy" alt="" src="https://drive.google.com/thumbnail?id=' + x.fileId + '&sz=w200">' + esc(x.nome) + '</a>' +
        '<div class="acoes"><button type="button" data-acao="trocar">Trocar</button>' +
        '<button type="button" data-acao="excluir">Excluir</button></div></div>';
    }).join('');
    $('guardadas').querySelectorAll('button[data-acao]').forEach(function (b) {
      var cartao = b.closest('.cartao'), chave = cartao.dataset.c;
      b.onclick = b.dataset.acao === 'excluir' ? function () { excluirGuardada(chave, cartao); } : function () { trocarGuardada(chave, cartao); };
    });
  }

  async function excluirGuardada(chave, cartao) {
    var nome = cartao.querySelector('a').textContent;
    if (!confirm('Excluir a foto de ' + nome + '? O link sai da planilha e a foto vai para a lixeira do Drive.')) return;
    cartao.style.opacity = .4;
    try {
      var est = await chamar('apiExcluirFoto', chave);
      if (porChave[chave]) porChave[chave].temFoto = false;
      mostrarAndamento(est);
    } catch (e) {
      cartao.style.opacity = 1;
      alert('Não deu para excluir: ' + (e && e.message || e));
    }
  }

  async function trocarGuardada(chave, cartao) {
    if (cartao.querySelector('input')) return;
    if (!pessoas.length) {
      pessoas = await chamar('apiPessoas');
      porChave = {};
      pessoas.forEach(function (p) { porChave[p.chave] = p; });
      preencherLista();
    }
    editando = true;
    var campo = document.createElement('input');
    campo.type = 'search'; campo.className = 'busca'; campo.setAttribute('list', 'pessoasLista');
    campo.placeholder = 'Nome certo';
    cartao.querySelector('.acoes').replaceWith(campo);
    campo.focus();
    var fechar = function () { editando = false; atualizarEstado(); };
    var salvar = async function (final) {
      if (campo.disabled) return;
      var nova = acharPorTexto(campo.value);
      if (nova === null || !nova) {
        if (final) { if (!campo.value.trim()) fechar(); else campo.setCustomValidity('Escolha um nome da lista'), campo.reportValidity(); }
        return;
      }
      if (!final && semAcento(campo.value) !== semAcento(rotulo(porChave[nova]))) return;
      if (porChave[nova].temFoto && nova !== chave &&
          !confirm(porChave[nova].nome + ' já tem foto. Trocar por esta? A dela vai para a lixeira.')) return;
      campo.disabled = true;
      try {
        var est = await chamar('apiTrocarPessoa', { de: chave, para: nova });
        if (porChave[chave]) porChave[chave].temFoto = false;
        porChave[nova].temFoto = true;
        editando = false;
        mostrarAndamento(est);
      } catch (e) {
        alert('Não deu para trocar: ' + (e && e.message || e));
        fechar();
      }
    };
    campo.oninput = function () { campo.setCustomValidity(''); salvar(false); };
    campo.onchange = function () { salvar(true); };
    campo.onkeydown = function (e) { if (e.key === 'Escape') fechar(); };
  }

  function atualizarEstado() {
    chamar('apiEstado').then(mostrarAndamento).catch(function () {
      clearTimeout(espera);
      espera = setTimeout(atualizarEstado, 15000);
    });
  }

  $('entrada').onchange = function (e) { abrirArquivos(e.target.files); e.target.value = ''; };
  $('entradaPasta').onchange = function (e) { abrirArquivos(e.target.files); e.target.value = ''; };
  $('botaoDrive').onclick = function () { $('drive').hidden = !$('drive').hidden; $('linkDrive').focus(); };
  $('abrirDrive').onclick = abrirDrive;
  $('linkDrive').onkeydown = function (e) { if (e.key === 'Enter') abrirDrive(); };
  $('enviar').onclick = enviarTodas;
  $('botaoGuardadas').onclick = function () { $('guardadas').hidden = !$('guardadas').hidden; };
  atualizarEstado();
  $('limpar').onclick = function () {
    if (enviando) return;
    itens = [];
    filtro = '';
    $('painel').hidden = true;
    $('barra').hidden = true;
    $('drive').hidden = true;
    document.body.classList.remove('com-fotos');
    $('rotulo').textContent = 'Escolher fotos';
  };
  var area = $('area');
  ['dragenter', 'dragover'].forEach(function (t) {
    area.addEventListener(t, function (e) { e.preventDefault(); area.classList.add('sobre'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    area.addEventListener(t, function (e) { e.preventDefault(); area.classList.remove('sobre'); });
  });
  area.addEventListener('drop', async function (e) {
    var entradas = Array.prototype.map.call(e.dataTransfer.items || [], function (i) {
      return i.webkitGetAsEntry ? i.webkitGetAsEntry() : null;
    }).filter(Boolean);
    if (!entradas.length) return abrirArquivos(e.dataTransfer.files);
    var listas = await Promise.all(entradas.map(lerEntrada));
    abrirArquivos([].concat.apply([], listas));
  });
</script>
</body>
</html>
